<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="基于西北太平洋历史台风路径、强度和季节的相似案例检索，并联动历史再分析。"/>
  <title>历史相似台风 · 云海观象台</title>
  <link rel="icon" href="/brand/logo-cn-blue.png"/>
  <link rel="stylesheet" href="/static/styles.css?v=2.4.4-0904a"/>
  <script src="/static/site.js?v=2.4.4-0904a" defer></script>
  <script src="/static/history-similar.js?v=2.4.4-0904a" defer></script>
</head>
<body class="luna-page">
  <header></header>
  <main class="luna-main history-workbench">
    <h1>历史相似台风</h1>
    <section class="history-analog signature-corner signature-corner--violet" id="history-analog">
      <div>
        <span>相似案例检索</span>
        <h2>选择目标台风</h2>
        <p>输入台风中文名、国际名、年份或历史资料编号。相似度只是筛选线索，各项分量会分别列出。</p>
        <form id="history-search-form">
          <input id="history-search" type="search" placeholder="例如：海燕、2013 或历史资料编号" autocomplete="off"/>
          <button type="submit">查找案例</button>
        </form>
        <div id="history-search-results" class="history-search-results"></div>
        <section class="history-track-view" id="history-track-view" hidden>
          <header><h3>目标与相似路径</h3><p>砖红为目标台风，其他颜色为前五个相似案例；经度已自动处理日期变更线。</p></header>
          <div id="history-track-map" role="img" aria-label="目标台风与历史相似台风路径地图"></div>
          <div id="history-track-legend"></div>
        </section>
        <div id="history-analog-results" class="history-analog-results"></div>
      </div>
      <a href="/reanalysis">打开历史再分析 →</a>
    </section>
    <section class="luna-explain">
      <h2>评分边界</h2>
      <p>当前评分由路径、最大强度和发生季节组成。历史再分析环境场已提供日期联动入口，在环境场正式进入评分前不会显示虚构分数。</p>
    </section>
  </main>
</body>
</html>
